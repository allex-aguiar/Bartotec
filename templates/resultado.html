<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fim do Desafio!</title>

    <link rel="stylesheet" href="static/style2.css">
</head>

<body>

    <header>
        <h1>🏆 Fim do Desafio!</h1>
        <p>Veja como foi o desempenho do seu PC.</p>
    </header>

    <main>

        <section class="resultado">

            <h2>Seu resultado</h2>

            <div class="resultado-card">

                <h3>🎯 Desempenho obtido</h3>
                <strong>{{ pontuacao }} pontos</strong>

            </div>

            <div class="resultado-card">

                <h3>💰 Preço gasto</h3>
                <strong>R$ {{ total }}</strong>

            </div>

            <div class="resultado-card">

                <h3>📋 Resultado</h3>
                <p>{{ resultado }}</p>

            </div>

            <h2>Obrigado por jogar! ❤️</h2>

            <a href="/index.html">
                <button>🔄 JOGAR NOVAMENTE</button>
            </a>

        </section>

    </matn>

    <footer>
        <p>Projeto desenvolvido para a Feira de Tecnologia</p>
    </footer>

</body>

</html>
